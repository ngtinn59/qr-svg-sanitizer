name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.0 is the floor declared in composer.json, so it has to stay green.
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      # v4 pins Node 20, which GitHub Actions runners now force onto Node 24 with
      # a deprecation warning on every run. v5 targets Node 24 directly.
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: php -l src/QrSvg.php

      - name: Test
        run: php tests/run.php

  browser:
    runs-on: ubuntu-latest

    name: Browsers (chromium, firefox, webkit)

    # The library has no JS in it. This job exists to keep the README's claim
    # about `unexpected-solidus-in-tag` honest: it is an assertion about how
    # three separate tokeniser implementations behave, so it gets re-checked on
    # every push rather than trusted from the day it was first observed.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: tests/browser
        run: npm install

      - name: Install browser engines
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test
        working-directory: tests/browser
        run: npx playwright test
